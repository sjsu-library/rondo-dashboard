<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edit Content · Rondo</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<!-- SheetJS: read/write the repo's rondo.xlsx entirely in the browser (free, no backend) -->
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<!-- Google's keyless public Visualization API — only used to IMPORT existing content
     from a Google Sheet when migrating an exhibit to the local file. No Cloud project,
     no API key. Same mechanism Rondo's own site uses. -->
<script src="https://www.gstatic.com/charts/loader.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg:#f7f5f2; --surface:#ffffff; --border:#e4e0db; --border-med:#d4d0cb;
    --text:#1a1816; --muted:#655f58; --faint:#6d6862;
    --green:#2d7a4f; --red:#c0392b; --blue:#2c5faa;
    --font-serif:'Lora', Georgia, serif; --font-mono:'DM Mono', monospace;
  }
  body { font-family: var(--font-mono); background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }

  .topbar { display: flex; align-items: center; justify-content: space-between; padding: 0 28px; height: 52px; background: var(--surface); border-bottom: 1px solid var(--border); flex-shrink: 0; position: sticky; top: 0; z-index: 10; }
  .topbar-left { display: flex; align-items: center; gap: 8px; font-size: 13px; min-width: 0; }
  .topbar-brand { font-family: var(--font-serif); font-weight: 500; color: var(--text); text-decoration: none; }
  .topbar-sep { color: var(--faint); }
  .topbar-repo { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .topbar-right { display: flex; gap: 8px; align-items: center; }

  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: 6px; font-size: 11px; font-family: var(--font-mono); font-weight: 500; cursor: pointer; border: none; text-decoration: none; transition: opacity .15s, background .15s; white-space: nowrap; }
  .btn:hover { opacity: .85; }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
  .btn-primary { background: var(--text); color: #fff; }
  .btn-green { background: var(--green); color: #fff; }

  .main { flex: 1; padding: 24px 28px 60px; max-width: 1200px; margin: 0 auto; width: 100%; }

  .page-head { margin-bottom: 14px; }
  .page-title { font-family: var(--font-serif); font-size: 26px; font-weight: 400; }
  .page-title em { font-style: italic; }
  .page-sub { font-size: 11px; color: var(--muted); margin-top: 4px; line-height: 1.6; }

  .banner { font-size: 11px; line-height: 1.6; padding: 11px 14px; border-radius: 7px; margin-bottom: 14px; display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
  .banner.info { background: #eef4fb; color: var(--blue); border: 1px solid #c7d9f0; }
  .banner .btn { flex-shrink: 0; }

  .toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; background: var(--surface); border: 1px solid var(--border); border-radius: 8px 8px 0 0; border-bottom: none; padding: 10px 14px; }
  .tabs { display: flex; gap: 4px; flex-wrap: wrap; flex: 1; min-width: 0; }
  .tab { padding: 6px 14px; border-radius: 6px; font-size: 11px; cursor: pointer; background: transparent; border: 1px solid var(--border); color: var(--muted); transition: all .12s; }
  .tab:hover { color: var(--text); }
  .tab.active { background: var(--text); color: #fff; border-color: var(--text); }
  .toolbar-actions { display: flex; gap: 8px; align-items: center; }
  .save-state { font-size: 10.5px; color: var(--faint); min-width: 90px; text-align: right; }
  .save-state.dirty { color: var(--blue); }
  .save-state.saved { color: var(--green); }
  .save-state.error { color: var(--red); }

  .grid-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: 0 0 8px 8px; overflow: auto; max-height: calc(100vh - 250px); }
  table.grid { border-collapse: collapse; width: 100%; font-size: 11.5px; }
  table.grid th, table.grid td { border: 1px solid var(--border); padding: 0; vertical-align: top; min-width: 120px; max-width: 460px; }
  table.grid thead th { position: sticky; top: 0; z-index: 2; background: #f1efeb; font-weight: 500; text-align: left; color: var(--text); }
  .rownum { position: sticky; left: 0; z-index: 1; background: #f1efeb; color: var(--faint); font-weight: 500; min-width: 34px; max-width: 34px; width: 34px; text-align: center; user-select: none; }
  thead .rownum { z-index: 3; }
  .cell { padding: 7px 9px; outline: none; line-height: 1.5; white-space: pre-wrap; word-break: break-word; min-height: 32px; }
  .cell:focus { background: #fffbe9; box-shadow: inset 0 0 0 2px var(--text); }
  .row-actions { width: 30px; min-width: 30px; text-align: center; }
  .del-row { border: none; background: transparent; color: var(--faint); cursor: pointer; font-size: 13px; padding: 4px; border-radius: 4px; line-height: 1; }
  .del-row:hover { color: var(--red); background: #fdf0ee; }

  .loading-wrap { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 70px 24px; gap: 14px; }
  .spinner { width: 24px; height: 24px; border: 2px solid var(--border); border-top-color: var(--text); border-radius: 50%; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-txt { font-size: 11px; color: var(--muted); }

  .gate { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 32px; text-align: center; max-width: 560px; margin: 40px auto; }
  .gate h2 { font-family: var(--font-serif); font-size: 20px; font-weight: 400; margin-bottom: 8px; }
  .gate p { font-size: 11.5px; color: var(--muted); line-height: 1.7; margin-bottom: 14px; }

  .msg { font-size: 11.5px; line-height: 1.6; padding: 12px 16px; border-radius: 6px; margin: 10px 0; }
  .msg.error { background: #fdf0ee; color: var(--red); border: 1px solid #f0c0bb; }

  .toast { position: fixed; bottom: 24px; right: 24px; background: var(--text); color: #fff; border-radius: 8px; padding: 12px 18px; font-size: 11px; z-index: 200; transform: translateY(10px); opacity: 0; transition: all .25s; pointer-events: none; max-width: 340px; }
  .toast.show { transform: translateY(0); opacity: 1; }
  :focus-visible { outline: 2px solid var(--text); outline-offset: 2px; border-radius: 3px; }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <a class="topbar-brand" href="landing.html">Rondo</a>
    <span class="topbar-sep" aria-hidden="true">/</span>
    <span class="topbar-repo" id="topbar-repo">Editor</span>
  </div>
  <div class="topbar-right">
    <a class="btn btn-ghost" id="btn-back" href="#">← Exhibit</a>
    <button class="btn btn-green" id="btn-save" onclick="saveAll()" disabled>Save</button>
  </div>
</div>

<main class="main" id="main">
  <div class="loading-wrap" id="loading"><div class="spinner" aria-hidden="true"></div><div class="loading-txt">Loading…</div></div>
</main>

<div class="toast" id="toast"><span id="toast-msg"></span></div>

<script>
  // ════════════════════════════════════════════════════════════════════════
  //  In-dashboard content editor — 100% free, GitHub-only.
  //  Reads/writes the exhibit repo's rondo.xlsx via the GitHub API (already
  //  authenticated through the dashboard's device-flow). No Google Cloud.
  // ════════════════════════════════════════════════════════════════════════
  const SHEET_NAMES = ['Site', 'Pages', 'Items'];       // Rondo's required tabs, in order
  const params  = new URLSearchParams(location.search);
  const owner   = params.get('owner');
  const repo    = params.get('repo');
  const ghToken = sessionStorage.getItem('gh_token');

  let model      = {};      // { Site: [[...]], Pages: [[...]], Items: [[...]] }
  let activeTab  = 'Site';
  let dirty      = false;
  let xlsxSha    = null;     // sha of rondo.xlsx (for GitHub update)
  let rondoJs    = null;     // { text, sha, remote, spreadsheetID, gids:{Site,Pages,Items} }

  if (!ghToken) { location.href = 'index.html'; }
  if (!owner || !repo) { location.href = 'landing.html'; }

  document.getElementById('btn-back').href = `exhibit.html?owner=${encodeURIComponent(owner)}&repo=${encodeURIComponent(repo)}`;
  document.getElementById('topbar-repo').textContent = repo;
  document.title = `${repo} · Edit · Rondo`;

  const gh = (path, opts) => {
    opts = opts || {};
    opts.headers = Object.assign({ 'Authorization': 'Bearer ' + ghToken, 'Accept': 'application/vnd.github+json' }, opts.headers || {});
    return fetch(`https://api.github.com/repos/${owner}/${repo}/${path}`, opts);
  };
  const showMain = (html) => { document.getElementById('main').innerHTML = html; };
  const showLoading = (txt) => showMain(`<div class="loading-wrap"><div class="spinner" aria-hidden="true"></div><div class="loading-txt">${txt}</div></div>`);

  // base64 (GitHub) -> Uint8Array
  function b64ToBytes(b64) {
    const bin = atob(b64.replace(/\n/g, ''));
    const out = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  async function init() {
    try {
      showLoading('Reading exhibit configuration…');
      await loadRondoJs();         // remote flag, spreadsheetID, gids, sha
      showLoading('Loading content…');

      if (rondoJs.remote && rondoJs.spreadsheetID) {
        // Exhibit still loads from Google Sheets — pull that live content in (keyless),
        // falling back to the repo's rondo.xlsx if the import can't complete.
        const ok = await importFromGoogle().catch(() => false);
        if (!ok) await loadXlsx(true);
        renderMigrateBanner();
      } else {
        await loadXlsx(false);     // local mode already — edit the repo file directly
        renderEditor();
      }
    } catch (err) {
      showMain(`<div class="msg error">⚠ ${err.message}</div>
        <a class="btn btn-ghost" href="exhibit.html?owner=${encodeURIComponent(owner)}&repo=${encodeURIComponent(repo)}">← Back to exhibit</a>`);
    }
  }

  async function loadRondoJs() {
    const res = await gh('contents/rondo.js');
    if (!res.ok) throw new Error('Could not read rondo.js from the repository.');
    const data = await res.json();
    const text = atob(data.content.replace(/\n/g, ''));
    const remoteM = text.match(/var\s+remote\s*=\s*(true|false)/);
    const idM = text.match(/var\s+spreadsheetID\s*=\s*["']([^"']+)["']/);
    const gid = (name) => { const m = text.match(new RegExp('var\\s+' + name + '\\s*=\\s*["\']([^"\']+)["\']')); return m ? m[1] : null; };
    rondoJs = {
      text, sha: data.sha,
      remote: remoteM ? remoteM[1] === 'true' : true,
      spreadsheetID: idM ? idM[1] : null,
      gids: { Site: gid('siteSheet'), Pages: gid('pagesSheet'), Items: gid('itemsSheet') }
    };
  }

  async function loadXlsx(silent) {
    const res = await gh('contents/rondo.xlsx');
    if (!res.ok) { if (silent) { blankModel(); return; } throw new Error('Could not read rondo.xlsx from the repository.'); }
    const data = await res.json();
    xlsxSha = data.sha;
    const wb = XLSX.read(b64ToBytes(data.content), { type: 'array' });
    SHEET_NAMES.forEach(name => {
      const ws = wb.Sheets[name];
      model[name] = ws ? XLSX.utils.sheet_to_json(ws, { header: 1, blankrows: false, defval: '' }) : [[]];
      if (!model[name].length) model[name] = [['']];
    });
  }

  function blankModel() { SHEET_NAMES.forEach(n => model[n] = [['']]); }

  // Import current content straight from the Google Sheet via the keyless public
  // Visualization API (no Cloud project / API key). Resolves true on success.
  function importFromGoogle() {
    return new Promise((resolve, reject) => {
      if (!window.google || !google.charts) return reject();
      google.charts.load('current', { packages: ['corechart'] }).then(() => {
        let done = 0, failed = false;
        SHEET_NAMES.forEach(name => {
          const gid = rondoJs.gids[name];
          if (gid == null) { failed = true; if (++done === SHEET_NAMES.length) finish(); return; }
          new google.visualization.Query(
            `https://docs.google.com/spreadsheets/d/${rondoJs.spreadsheetID}/gviz/tq?gid=${gid}&headers=1`
          ).send((res) => {
            if (res.isError()) { failed = true; model[name] = [['']]; }
            else { model[name] = gvizToAoa(JSON.parse(res.getDataTable().toJSON())); }
            if (++done === SHEET_NAMES.length) finish();
          });
        });
        function finish() { failed ? reject() : resolve(true); }
      }, reject);
    });
  }

  function gvizToAoa(g) {
    const headers = (g.cols || []).map(c => (c.label || '').toString());
    const rows = (g.rows || []).map(r => (g.cols || []).map((_, i) => (r.c && r.c[i] && r.c[i].v != null) ? r.c[i].v : ''));
    return [headers, ...rows];
  }

  // ── UI ──
  function renderMigrateBanner() {
    renderEditor(`<div class="banner info">
      <span>This exhibit currently loads from Google Sheets. Saving here switches it to the
      spreadsheet stored in your repository (fully free, no Google account needed to view or edit).
      Your current Sheet content has been loaded below.</span>
    </div>`);
  }

  function esc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  function renderEditor(bannerHtml) {
    const data = model[activeTab] || [['']];
    let cols = 1; data.forEach(r => cols = Math.max(cols, r.length));
    const header = data[0] || [];
    const body = data.slice(1);

    let thead = '<tr><th class="rownum"></th>';
    for (let c = 0; c < cols; c++) thead += `<th><div class="cell" contenteditable="true" oninput="markDirty()">${esc(header[c])}</div></th>`;
    thead += '<th class="row-actions"></th></tr>';

    let tbody = '';
    body.forEach((row, ri) => {
      tbody += `<tr><td class="rownum">${ri + 1}</td>`;
      for (let c = 0; c < cols; c++) tbody += `<td><div class="cell" contenteditable="true" oninput="markDirty()">${esc(row[c])}</div></td>`;
      tbody += `<td class="row-actions"><button class="del-row" title="Delete row" aria-label="Delete row ${ri + 1}" onclick="deleteRow(this)">✕</button></td></tr>`;
    });

    const tabsHtml = SHEET_NAMES.map(n => `<button class="tab ${n === activeTab ? 'active' : ''}" onclick="switchTab('${n}')">${n}</button>`).join('');

    showMain(`
      <div class="page-head">
        <div class="page-title">Editing <em>${esc(repo)}</em></div>
        <div class="page-sub">Edit cells directly, then Save. Your changes are committed to <code>rondo.xlsx</code> in the repo; the live site updates after GitHub Pages rebuilds (~1 min).</div>
      </div>
      ${bannerHtml || ''}
      <div class="toolbar">
        <div class="tabs">${tabsHtml}</div>
        <div class="toolbar-actions">
          <button class="btn btn-ghost" onclick="addRow()">+ Row</button>
          <span class="save-state" id="save-state">${dirty ? 'Unsaved changes' : 'Saved'}</span>
        </div>
      </div>
      <div class="grid-wrap"><table class="grid"><thead>${thead}</thead><tbody id="grid-body">${tbody}</tbody></table></div>`);
    setSaveState(dirty ? 'dirty' : 'saved');
    document.getElementById('btn-save').disabled = !dirty;
  }

  function syncActiveToModel() {
    const headEls = document.querySelectorAll('thead .cell');
    if (!headEls.length) return;
    const header = [...headEls].map(c => c.innerText.replace(/\n$/, ''));
    const rows = [header];
    document.querySelectorAll('#grid-body tr').forEach(tr => {
      rows.push([...tr.querySelectorAll('.cell')].map(c => c.innerText.replace(/\n$/, '')));
    });
    model[activeTab] = rows;
  }

  function switchTab(name) {
    if (name === activeTab) return;
    syncActiveToModel();
    activeTab = name;
    renderEditor();
  }
  function markDirty() { dirty = true; document.getElementById('btn-save').disabled = false; setSaveState('dirty'); }
  function setSaveState(s) {
    const el = document.getElementById('save-state'); if (!el) return;
    el.className = 'save-state ' + s;
    el.textContent = s === 'dirty' ? 'Unsaved changes' : s === 'saving' ? 'Saving…' : s === 'error' ? 'Save failed' : 'Saved';
  }
  function addRow() {
    const body = document.getElementById('grid-body');
    const cols = document.querySelectorAll('thead .cell').length || 1;
    const tr = document.createElement('tr');
    let html = `<td class="rownum">${body.querySelectorAll('tr').length + 1}</td>`;
    for (let c = 0; c < cols; c++) html += `<td><div class="cell" contenteditable="true" oninput="markDirty()"></div></td>`;
    html += `<td class="row-actions"><button class="del-row" title="Delete row" onclick="deleteRow(this)">✕</button></td>`;
    tr.innerHTML = html; body.appendChild(tr); renumber(); markDirty();
    tr.querySelector('.cell').focus();
  }
  function deleteRow(btn) { btn.closest('tr').remove(); renumber(); markDirty(); }
  function renumber() { document.querySelectorAll('#grid-body tr').forEach((tr, i) => tr.querySelector('.rownum').textContent = i + 1); }

  // ── Save: build rondo.xlsx and commit via GitHub; flip remote->false if needed ──
  async function saveAll() {
    syncActiveToModel();
    setSaveState('saving');
    document.getElementById('btn-save').disabled = true;
    try {
      const wb = XLSX.utils.book_new();
      SHEET_NAMES.forEach(name => XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(model[name] || [['']]), name));
      const b64 = XLSX.write(wb, { bookType: 'xlsx', type: 'base64' });

      // Make sure we have the current file's sha before updating it. On the
      // migrate path (content imported from Google) we never read rondo.xlsx,
      // so fetch its sha now; a 404 means the file doesn't exist yet (create).
      if (!xlsxSha) {
        const cur = await gh('contents/rondo.xlsx');
        if (cur.ok) xlsxSha = (await cur.json()).sha;
      }

      const body = { message: `Edit exhibit content (${activeTab} and others)`, content: b64 };
      if (xlsxSha) body.sha = xlsxSha;
      const putXlsx = await gh('contents/rondo.xlsx', {
        method: 'PUT', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      if (!putXlsx.ok) { const e = await putXlsx.json().catch(() => ({})); throw new Error(e.message || ('xlsx save failed (' + putXlsx.status + ')')); }
      xlsxSha = (await putXlsx.json()).content.sha;

      // Switch the exhibit to the local file if it was still on Google Sheets.
      if (rondoJs.remote) {
        const newText = rondoJs.text.replace(/var\s+remote\s*=\s*true/, 'var remote = false');
        const putJs = await gh('contents/rondo.js', {
          method: 'PUT', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: 'Switch exhibit to local spreadsheet (rondo.xlsx)', content: btoa(unescape(encodeURIComponent(newText))), sha: rondoJs.sha })
        });
        if (putJs.ok) { const d = await putJs.json(); rondoJs.sha = d.content.sha; rondoJs.text = newText; rondoJs.remote = false; }
      }
      dirty = false; setSaveState('saved');
      toast('✓ Saved — your live site will update after it rebuilds (~1 min)');
    } catch (err) {
      setSaveState('error'); document.getElementById('btn-save').disabled = false;
      toast('⚠ Could not save: ' + err.message);
    }
  }

  window.addEventListener('beforeunload', (e) => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });

  let toastT;
  function toast(msg) {
    const t = document.getElementById('toast');
    document.getElementById('toast-msg').textContent = msg;
    t.classList.add('show'); clearTimeout(toastT);
    toastT = setTimeout(() => t.classList.remove('show'), 3200);
  }

  init();
</script>
</body>
</html>
